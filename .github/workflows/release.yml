name: Release

# Set the version in the VERSION file, commit, then push a matching tag:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      # Pinned to a commit, not a tag that can move: v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Don't leave the write token in .git/config while tests and the
          # build run; only the publish step gets it.
          persist-credentials: false

      - name: Check version
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$file" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION file ($file)"
            exit 1
          fi

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build and package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "DirectStat ${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md \
            --generate-notes
