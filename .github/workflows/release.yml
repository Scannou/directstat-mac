name: Release

# Push a version tag to publish a release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build and package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "DirectStat ${GITHUB_REF_NAME#v}" \
            --notes-file build/release-notes.md \
            --generate-notes
